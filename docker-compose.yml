services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tbonk
      POSTGRES_USER: tbonk
      POSTGRES_PASSWORD: tbonk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbonk -d tbonk"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://tbonk:tbonk@db:5432/tbonk
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
