x-app: &app
  build: .
  image: tbonk-tasks:local
  environment:
    PGHOST: db
    PGPORT: "5432"
    PGDATABASE: ${POSTGRES_DB:-tbonk}
    PGUSER: ${POSTGRES_USER:-tbonk}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    PORT: ${PORT:-8000}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tbonk}
      POSTGRES_USER: ${POSTGRES_USER:-tbonk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  init-db:
    <<: *app
    command: ["python", "manage.py", "init-db"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    depends_on:
      init-db:
        condition: service_completed_successfully
volumes:
  postgres_data:
