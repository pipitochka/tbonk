apiVersion: v1
kind: ConfigMap
metadata:
  name: tbonk-config
  namespace: tbonk
data:
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: tbonk
  PGUSER: tbonk
  POSTGRES_DB: tbonk
  POSTGRES_USER: tbonk
  PORT: "8000"
  WEB_CONCURRENCY: "1"
---
# Disposable training credentials. Replace before using real data.
apiVersion: v1
kind: Secret
metadata:
  name: tbonk-db
  namespace: tbonk
type: Opaque
stringData:
  PGPASSWORD: tbonk-local-only
  POSTGRES_PASSWORD: tbonk-local-only
