apiVersion: batch/v1
kind: Job
metadata:
  name: tbonk-init-db
  namespace: tbonk
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: tbonk-init-db
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: tbonk-tasks:hw6
          imagePullPolicy: Never
          command: ["python", "-m", "backend.manage", "init-db"]
          envFrom:
            - configMapRef:
                name: tbonk-config
            - secretRef:
                name: tbonk-db
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
