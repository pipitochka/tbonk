apiVersion: v1
kind: Service
metadata:
  name: tbonk
  namespace: tbonk
spec:
  selector:
    app: tbonk
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tbonk
  namespace: tbonk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tbonk
  template:
    metadata:
      labels:
        app: tbonk
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: tbonk-tasks:hw3
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tbonk-config
            - secretRef:
                name: tbonk-db
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
