groups:
  - name: tbonk-service
    interval: 15s
    rules:
      - alert: TbonkHighErrorRate
        expr: |
          (sum(rate(tbonk_task_operations_total{app="tbonk",outcome="server_error"}[2m]))
          / sum(rate(tbonk_task_operations_total{app="tbonk",outcome=~"success|server_error"}[2m])) > 0.05)
          and (sum(rate(tbonk_task_operations_total{app="tbonk",outcome=~"success|server_error"}[2m])) > 0.1)
        for: 1m
        labels:
          service: tbonk
          severity: critical
        annotations:
          summary: More than 5% of valid task operations fail
          description: Check application error logs and PostgreSQL availability. Demo recovery is demo-mode.sh off.
      - alert: TbonkSlowOperations
        expr: |
          (sum(rate(tbonk_task_operation_duration_seconds_bucket{app="tbonk",outcome="success",le="0.5"}[2m]))
          / sum(rate(tbonk_task_operation_duration_seconds_count{app="tbonk",outcome="success"}[2m])) < 0.95)
          and (sum(rate(tbonk_task_operation_duration_seconds_count{app="tbonk",outcome="success"}[2m])) > 0.1)
        for: 1m
        labels:
          service: tbonk
          severity: warning
        annotations:
          summary: Fewer than 95% of successful task operations finish in 500ms
          description: Check PostgreSQL latency, Python CPU and request rate. Demo recovery is demo-mode.sh off.
      - alert: TbonkAppUnavailable
        expr: sum(up{app="tbonk"}) == 0 or absent(up{app="tbonk"})
        for: 1m
        labels:
          service: tbonk
          severity: critical
        annotations:
          summary: No application metrics target is reachable
          description: Check Deployment replicas, pods and scrape discovery. This is a scrape signal, not a full user SLI.
      - alert: TbonkProbeFailure
        expr: max_over_time(tbonk_probe_success{app="tbonk-prober"}[1m]) == 0
        for: 1m
        labels:
          service: tbonk
          severity: critical
        annotations:
          summary: The full synthetic CRUD scenario keeps failing
          description: Inspect prober logs and app API responses; check Service routing and database connectivity.
      - alert: TbonkProbeMissing
        expr: |
          up{app="tbonk-prober"} == 0
          or absent(up{app="tbonk-prober"})
          or (time() - tbonk_probe_last_run_timestamp_seconds{app="tbonk-prober"} > 60)
        for: 1m
        labels:
          service: tbonk
          severity: warning
        annotations:
          summary: Synthetic monitoring is unavailable or stale
          description: Restore the prober or scraping; a stale success value does not establish service health.
  - name: tbonk-python
    interval: 15s
    rules:
      - alert: TbonkHighPythonMemory
        expr: process_resident_memory_bytes{app="tbonk"} > 100 * 1024 * 1024
        for: 1m
        labels:
          service: tbonk
          severity: warning
        annotations:
          summary: Python worker RSS exceeds 100MiB
          description: Check growth and leaks; this worker has a 256MiB container limit shared with Gunicorn. Demo recovery is demo-mode.sh off.
      - alert: TbonkHighPythonCPU
        expr: rate(process_cpu_seconds_total{app="tbonk"}[2m]) > 0.8
        for: 1m
        labels:
          service: tbonk
          severity: warning
        annotations:
          summary: Python worker uses more than 0.8 CPU cores
          description: Check load, slow operations and profiling; the app container has a one-core CPU limit.
