apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.134.0
          args:
            - -rule=/config/rules.yaml
            - -datasource.url=http://vm-single.monitoring.svc.cluster.local:8428
            - -notifier.url=http://alertmanager.monitoring.svc.cluster.local:9093
            - -remoteWrite.url=http://vm-single.monitoring.svc.cluster.local:8428
            - -remoteRead.url=http://vm-single.monitoring.svc.cluster.local:8428
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: rules
              mountPath: /config
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: tbonk-alert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: monitoring
spec:
  selector: {app: vmalert}
  ports:
    - {name: http, port: 8880, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: alertmanager}
  template:
    metadata:
      labels: {app: alertmanager}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args: ["--config.file=/config/alertmanager.yaml", "--storage.path=/alertmanager", "--cluster.listen-address="]
          ports:
            - {name: http, containerPort: 9093}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap: {name: tbonk-alertmanager-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector: {app: alertmanager}
  ports:
    - {name: http, port: 9093, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-inbox
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: alert-inbox}
  template:
    metadata:
      labels: {app: alert-inbox}
    spec:
      containers:
        - name: inbox
          image: tbonk-tasks:hw6
          imagePullPolicy: Never
          command: ["gunicorn", "--config", "/dev/null", "--bind", "0.0.0.0:8080", "--workers", "1", "--threads", "2", "backend.alert_inbox:app"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-inbox
  namespace: monitoring
spec:
  selector: {app: alert-inbox}
  ports:
    - {name: http, port: 8080, targetPort: http}
