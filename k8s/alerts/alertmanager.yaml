global:
  resolve_timeout: 2m
route:
  receiver: local-inbox
  group_by: [alertname, service, severity]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
receivers:
  - name: local-inbox
    webhook_configs:
      - url: http://alert-inbox.monitoring.svc.cluster.local:8080/alerts
        send_resolved: true
