apiVersion: apps/v1
kind: Deployment
metadata:
  name: tbonk-prober
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tbonk-prober
  template:
    metadata:
      labels:
        app: tbonk-prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9115"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: prober
          image: tbonk-tasks:hw6
          imagePullPolicy: Never
          command: ["python", "-m", "backend.prober"]
          env:
            - name: PROBE_URL
              value: http://tbonk.tbonk.svc.cluster.local:8000
            - name: PROBE_INTERVAL_SECONDS
              value: "15"
            - name: SERVICE_NAME
              value: tbonk-prober
          ports:
            - name: metrics
              containerPort: 9115
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
