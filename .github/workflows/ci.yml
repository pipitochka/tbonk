name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tbonk
          POSTGRES_USER: tbonk
          POSTGRES_PASSWORD: tbonk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbonk -d tbonk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tbonk:tbonk@localhost:5432/tbonk
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py wsgi.py tests
      - name: Run integration tests
        run: python -m pytest -vv --tb=long
