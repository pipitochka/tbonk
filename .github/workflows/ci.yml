name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tbonk
          POSTGRES_USER: tbonk
          POSTGRES_PASSWORD: tbonk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbonk -d tbonk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tbonk:tbonk@localhost:5432/tbonk
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend scripts
      - name: Run integration tests
        run: python -m pytest -vv --tb=long
      - name: Test alert thresholds and hold times
        run: >-
          docker run --rm -v "$PWD/k8s/alerts:/config:ro"
          --entrypoint /bin/promtool prom/prometheus:v3.2.1
          test rules /config/rules.test.yaml
      - name: Validate Alertmanager configuration
        run: >-
          docker run --rm -v "$PWD/k8s/alerts:/config:ro"
          --entrypoint /bin/amtool prom/alertmanager:v0.28.1
          check-config /config/alertmanager.yaml
